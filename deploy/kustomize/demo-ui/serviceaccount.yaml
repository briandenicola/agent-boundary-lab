# Separate from the harness account so the UI's Foundry rights can be granted and revoked
# on their own. It needs Foundry Agent Consumer to invoke; that grant is Terraform's job
# and is NOT made here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-ui
  namespace: REPLACE_WITH_NAMESPACE
  labels:
    app.kubernetes.io/part-of: agent-boundary-lab
    app.kubernetes.io/name: demo-ui
  annotations:
    azure.workload.identity/client-id: REPLACE_WITH_DEMO_UI_CLIENT_ID
