# The pod runs as THIS account, and the federated credential in infra/cloud/identity.tf
# names exactly this account in its subject.
#
# An init container shares its pod's ServiceAccount, and a ServiceAccount carries exactly
# one `azure.workload.identity/client-id`. So the whole harness pod runs as the deployer
# identity. When the A2A client loop lands it will also need Foundry Agent Consumer to
# invoke; either grant it to this same identity or split the deploy into its own pod.
# There is no second annotation to add.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: REPLACE_WITH_SERVICE_ACCOUNT
  namespace: REPLACE_WITH_NAMESPACE
  labels:
    app.kubernetes.io/part-of: agent-boundary-lab
  annotations:
    # Client ID of the user-assigned identity the workload-identity webhook exchanges the
    # projected token for. Substituted from `terraform output`, never pasted: a stale GUID
    # here fails at token exchange, long after apply reports success.
    azure.workload.identity/client-id: REPLACE_WITH_AGENT_DEPLOYER_CLIENT_ID
