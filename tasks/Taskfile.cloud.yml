version: '3'

# Task echoes every command by default, so anything that prints its own
# output shows up twice. These tasks are written to be read by a human
# watching a demo, so the command itself is noise.
silent: true

# The full demo environment.
#
# This creates real, billable Azure resources including an AKS cluster and a Foundry
# account. It is considerably more expensive than the spike, so nothing here applies as a
# side effect of planning or reading output.
#
# Tear it down with `task cloud:down` when you are finished.

env:
  CLOUD_DIR: infra/cloud
  # The agent image digest both agent versions must pin. Read the current value with
  # `task build:agent-digest`. Override with AGENT_IMAGE_DIGEST=sha256:... if you rebuild.
  #
  # A tag is rejected by a check in `_harness-stream`. That is deliberate: tags are
  # mutable, and two agent versions running different code makes the egress
  # policy no longer the only variable between them.
  # These are read from the environment at the point of use, not declared here.
  # A top-level `env:` entry of the form `VAR: '{{default X .VAR}}'` cannot see a
  # value the root Taskfile loaded from .env -- it resolves to the default and then
  # EXPORTS that over the .env value, so setting the variable in .env silently did
  # nothing. Shell expansion at the point of use reads the real environment.
  # Confirm the real value for your account with `task cloud:base-policies` before
  # applying. A custom RAI policy must derive from a base policy that actually exists.
  # Tag of the two controlled-endpoint images. EMPTY means "run the placeholder", which
  # is correct on a first apply because the images do not exist in ACR yet. After
  # `task build:deploy-endpoints`, set ENDPOINT_IMAGE_TAG=latest in your .env — the root
  # Taskfile loads it — or `cloud:up` will roll both endpoints back to the placeholder.

includes:
  arm:
    taskfile: ./Taskfile.arm.yml
    internal: true

tasks:
  default:
    desc: Show available cloud tasks
    cmds:
      - task --list

  whoami:
    desc: Show which subscription and tenant an apply would target
    cmds:
      - az account show --query "{subscription:name, id:id, tenant:tenantId, user:user.name}" -o table

  init:
    desc: Initialise terraform for the demo environment
    cmds:
      - terraform -chdir=./{{.CLOUD_DIR}} init -upgrade

  _init-once:
    internal: true
    # `terraform init` is slow and is needed only when the provider requirements or the
    # lock file change, so that is exactly what is fingerprinted. Running it
    # unconditionally before every plan and apply added a wait to operations that did
    # not need one, which trains you to walk away from the terminal during an apply.
    #
    # The stamp lives INSIDE .terraform deliberately: deleting that directory removes
    # the stamp with it, so a wiped provider cache re-initialises instead of failing
    # with "Please run terraform init". Run `task cloud:init` to force one anyway,
    # which is also the only path that passes -upgrade.
    sources:
      - '{{.CLOUD_DIR}}/providers.tf'
      - '{{.CLOUD_DIR}}/.terraform.lock.hcl'
    generates:
      - '{{.CLOUD_DIR}}/.terraform/abl-init-stamp'
    cmds:
      - terraform -chdir=./{{.CLOUD_DIR}} init -input=false
      - touch ./{{.CLOUD_DIR}}/.terraform/abl-init-stamp

  fmt:
    desc: Format the terraform
    cmds:
      - terraform -chdir=./{{.CLOUD_DIR}} fmt -recursive

  validate:
    desc: Validate the terraform without contacting Azure
    cmds:
      - terraform -chdir=./{{.CLOUD_DIR}} init -backend=false -input=false
      - terraform -chdir=./{{.CLOUD_DIR}} validate

  plan:
    desc: Show what would be created (creates nothing)
    cmds:
      - task: _init-once
      - terraform -chdir=./{{.CLOUD_DIR}} plan -compact-warnings -var "region={{.REGION}}" -var "rai_base_policy_name=${RAI_BASE_POLICY:-Microsoft.DefaultV2}" -var "endpoint_image_tag=${ENDPOINT_IMAGE_TAG:-}"
    vars:
      REGION: '{{default .DEFAULT_REGION .CLI_ARGS}}'

  up:
    desc: CREATES BILLABLE RESOURCES including an AKS cluster. Apply the environment
    aliases: [apply]
    cmds:
      - task: _init-once
      - terraform -chdir=./{{.CLOUD_DIR}} apply -auto-approve -compact-warnings -var "region={{.REGION}}" -var "rai_base_policy_name=${RAI_BASE_POLICY:-Microsoft.DefaultV2}" -var "endpoint_image_tag=${ENDPOINT_IMAGE_TAG:-}"
      - task: endpoints
    vars:
      REGION: '{{default .DEFAULT_REGION .CLI_ARGS}}'

  workbook-plan:
    desc: Show what creating ONLY the evidence workbook would change (creates nothing)
    cmds:
      - task: _init-once
      - terraform -chdir=./{{.CLOUD_DIR}} plan -compact-warnings -target=azurerm_application_insights_workbook.egress_evidence -var "region={{.REGION}}" -var "rai_base_policy_name=${RAI_BASE_POLICY:-Microsoft.DefaultV2}" -var "endpoint_image_tag=${ENDPOINT_IMAGE_TAG:-}"
    vars:
      REGION: '{{default .DEFAULT_REGION .CLI_ARGS}}'

  workbook-up:
    desc: CREATES the evidence workbook only (one Azure resource, no compute). Prompts first
    prompt: Create the egress evidence workbook in Azure (only that resource)?
    cmds:
      - task: _init-once
      - terraform -chdir=./{{.CLOUD_DIR}} apply -auto-approve -compact-warnings -target=azurerm_application_insights_workbook.egress_evidence -var "region={{.REGION}}" -var "rai_base_policy_name=${RAI_BASE_POLICY:-Microsoft.DefaultV2}" -var "endpoint_image_tag=${ENDPOINT_IMAGE_TAG:-}"
      - terraform -chdir=./{{.CLOUD_DIR}} output evidence_workbook_id
    vars:
      REGION: '{{default .DEFAULT_REGION .CLI_ARGS}}'

  network-plan:
    desc: Show the managed-network FQDN rules that network-up would create (creates nothing)
    cmds:
      - task: _init-once
      - terraform -chdir=./{{.CLOUD_DIR}} plan -compact-warnings -target=azapi_resource.network_fqdn_rule -var "region={{.REGION}}" -var "rai_base_policy_name=${RAI_BASE_POLICY:-Microsoft.DefaultV2}" -var "endpoint_image_tag=${ENDPOINT_IMAGE_TAG:-}" {{.EXTRA}}
    vars:
      REGION: '{{default .DEFAULT_REGION .CLI_ARGS}}'
      EXTRA: '{{default "" .TF_EXTRA}}'

  network-up:
    desc: BILLABLE. Creates the managed-network FQDN rules, which creates the managed Azure Firewall (Standard; cannot change later)
    prompt: This creates the billable managed Azure Firewall (Standard, cannot be changed later). Apply only the FQDN rules?
    cmds:
      - task: _init-once
      - terraform -chdir=./{{.CLOUD_DIR}} apply -auto-approve -compact-warnings -target=azapi_resource.network_fqdn_rule -var "region={{.REGION}}" -var "rai_base_policy_name=${RAI_BASE_POLICY:-Microsoft.DefaultV2}" -var "endpoint_image_tag=${ENDPOINT_IMAGE_TAG:-}" {{.EXTRA}}
    vars:
      REGION: '{{default .DEFAULT_REGION .CLI_ARGS}}'
      EXTRA: '{{default "" .TF_EXTRA}}'

  network-probe:
    desc: ONE-TIME PATCH of the managed network to AllowOnlyApprovedOutbound (keeps firewallSku Standard). IRREVERSIBLE if it succeeds. Prints the raw response or error
    prompt: Send ONE PATCH setting managednetworks/default to AllowOnlyApprovedOutbound? One-way if accepted.
    cmds:
      - task: arm:_account-id
        vars: {TAG: '{{.TITLE}}', OUT: /tmp/abl-account-id}
      - |
        set -u
        URL="https://management.azure.com$(cat /tmp/abl-account-id)/managednetworks/default?api-version=2025-10-01-preview"
        az rest --method patch --url "$URL" --headers "Content-Type=application/json" \
          --body '{"properties":{"managedNetwork":{"isolationMode":"AllowOnlyApprovedOutbound","firewallSku":"Standard"}}}' \
          --only-show-errors || echo "PATCH FAILED (see error above); nothing was changed unless a body printed"
        echo "--- readback ---"
        az rest --method get --url "$URL" --query "properties.managedNetwork.{isolationMode:isolationMode,firewallSku:firewallSku,changeable:changeableIsolationModes,state:provisioningState}" -o json --only-show-errors

  base-policies:
    desc: List the RAI base policies that exist on the demo's Foundry account
    cmds:
      - task: arm:_account-id
        vars: {TAG: '{{.TITLE}}', OUT: /tmp/abl-account-id}
      - task: arm:_arm-get
        vars:
          URL:
            sh: echo "https://management.azure.com$(cat /tmp/abl-account-id)/raiPolicies?api-version=2026-05-15-preview"
          QUERY: "value[].{name:name, type:properties.type, basePolicy:properties.basePolicyName, mode:properties.mode, egress:properties.egressPolicy}"
          OUT: /tmp/abl-base-policies.json
      - cat /tmp/abl-base-policies.json

  show-base:
    desc: Dump a base RAI policy in full, to copy its contentFilters verbatim
    cmds:
      # Fetched from the collection rather than by direct GET: a direct GET on a
      # system-managed policy returns 404 even though it appears in the list.
      - task: arm:_account-id
        vars: {TAG: '{{.TITLE}}', OUT: /tmp/abl-account-id}
      - task: arm:_arm-get
        vars:
          URL:
            sh: echo "https://management.azure.com$(cat /tmp/abl-account-id)/raiPolicies?api-version=2026-05-15-preview"
          QUERY: "value[?name=='{{.BASE}}'] | [0]"
          OUT: /tmp/abl-base-policy.json
      - cat /tmp/abl-base-policy.json
    vars:
      BASE: '{{default "Microsoft.DefaultV2" .CLI_ARGS}}'

  endpoints:
    desc: Show the agent's two destinations and which one is allowlisted
    cmds:
      - |
        set -eu
        echo "ALLOWLISTED   (expected: success)"
        echo "  $(terraform -chdir=./{{.CLOUD_DIR}} output -raw policy_api_url)"
        echo
        echo "NOT ALLOWLISTED (expected: platform denial)"
        echo "  $(terraform -chdir=./{{.CLOUD_DIR}} output -raw test_receiver_url)"
        echo
        echo "The only difference between these two is whether the egress policy names"
        echo "them. No application code knows which is which."

  policies:
    desc: Prove the two RAI policies differ in EXACTLY one field
    cmds:
      # The single-variable claim is checkable, so check it rather than asserting it.
      # Read from ARM, not from state: state is what terraform believes it wrote.
      - task: arm:_arm-get
        vars:
          URL:
            sh: echo "https://management.azure.com$(terraform -chdir=./{{.CLOUD_DIR}} output -raw foundry_account_id)/raiPolicies?api-version=2026-05-15-preview"
          QUERY: "value[?properties.type=='UserManaged'].{name:name, contentSafetyMode:properties.mode, basePolicy:properties.basePolicyName, egressMode:properties.egressPolicy.mode, defaultAction:properties.egressPolicy.defaultAction, rules:properties.egressPolicy.rules}"
          OUT: /tmp/abl-policies.json
      - |
        set -eu
        cat /tmp/abl-policies.json

        echo
        echo "=== difference between the two policies, ignoring the name ==="
        AUDIT=$(jq -S 'map(select(.name=="egress-audit"))[0] | del(.name, .egressMode)' /tmp/abl-policies.json)
        ENFORCED=$(jq -S 'map(select(.name=="egress-enforced"))[0] | del(.name, .egressMode)' /tmp/abl-policies.json)

        # Both absent also compares equal. Without this, a policy that was never created
        # reads as "identical to the other one" and certifies the single-variable design.
        if [ "$AUDIT" = "null" ] || [ "$ENFORCED" = "null" ] || [ -z "$AUDIT" ] || [ -z "$ENFORCED" ]; then
          echo "ONE OR BOTH POLICIES ARE MISSING FROM THIS ACCOUNT."
          echo "  egress-audit:    $([ "$AUDIT" = "null" ] || [ -z "$AUDIT" ] && echo MISSING || echo present)"
          echo "  egress-enforced: $([ "$ENFORCED" = "null" ] || [ -z "$ENFORCED" ] && echo MISSING || echo present)"
          echo "This is not a passing comparison. Apply infra/cloud."
          exit 1
        fi

        if [ "$AUDIT" = "$ENFORCED" ]; then
          echo "IDENTICAL apart from egressPolicy.mode. The single-variable design holds."
        else
          echo "THE TWO POLICIES DIFFER IN MORE THAN THE EGRESS MODE."
          echo "Any result from this environment is UNATTRIBUTABLE until this is fixed."
          diff <(echo "$AUDIT") <(echo "$ENFORCED") || true
          exit 1
        fi

  output:
    desc: Show all terraform outputs
    cmds:
      - terraform -chdir=./{{.CLOUD_DIR}} output

  caveats:
    desc: Print what this environment does and does not establish
    cmds:
      - terraform -chdir=./{{.CLOUD_DIR}} output -raw what_this_environment_does_not_prove
      - echo

  kubeconfig:
    desc: Fetch AKS credentials for the workflow app
    cmds:
      - task: _require-kubelogin
      - |
        set -eu
        RG=$(terraform -chdir=./{{.CLOUD_DIR}} output -raw resource_group_name)
        AKS=$(terraform -chdir=./{{.CLOUD_DIR}} output -raw aks_cluster_name)
        az aks get-credentials --resource-group "$RG" --name "$AKS" --overwrite-existing

  app-insights-connection:
    desc: Confirm the project is connected to Application Insights. Run this BEFORE trusting any run.
    cmds:
      # Read-only. Without this connection the platform layer is SILENT: docs/compatibility.md
      # C1/C4 establish that a project connection to Application Insights is the only path
      # egress decision records take. A run with no connection is inconclusive by
      # construction, and it looks exactly like "the policy did nothing".
      #
      # Read from ARM rather than from terraform state: state is what terraform believes
      # it wrote.
      - task: arm:_arm-get
        vars:
          URL:
            sh: echo "https://management.azure.com$(terraform -chdir=./{{.CLOUD_DIR}} output -raw foundry_account_id)/projects/$(terraform -chdir=./{{.CLOUD_DIR}} output -raw project_name)/connections?api-version=2026-05-15-preview"
          QUERY: "value[?properties.category=='AppInsights'].{name:name, category:properties.category, authType:properties.authType, target:properties.target}"
          OUT: /tmp/abl-connections.json
      - |
        set -eu
        FOUND=$(cat /tmp/abl-connections.json)
        echo "$FOUND"
        echo

        if [ "$(echo "$FOUND" | jq 'length')" -eq 0 ]; then
          echo "NO APPLICATION INSIGHTS CONNECTION ON THIS PROJECT."
          echo "Platform egress evidence will not be produced. Any run is INCONCLUSIVE."
          echo "Apply infra/cloud and re-check."
          exit 1
        fi

        if [ "$(echo "$FOUND" | jq -r '.[0].authType')" != "ApiKey" ]; then
          echo "The connection exists but does not use ApiKey auth."
          echo "azure/ai/projects/_patch_telemetry.py rejects anything else, so the"
          echo "platform will not resolve a connection string. Treat as NOT connected."
          exit 1
        fi

        echo "Connected, with ApiKey auth. The credential itself is not readable here and"
        echo "does not need to be: this confirms the path exists, not that a record landed."
        echo "Confirm actual evidence with the KQL in docs/demo-runbook.md after a run."

  #############################################
  # AGENT MODEL ACCESS
  #
  # Each hosted agent calls the model at the ACCOUNT-level OpenAI endpoint
  # (https://<account>.cognitiveservices.azure.com), which the project does NOT proxy, so
  # the agent's own Entra identity needs a data-plane role on the account. Observed
  # 2026-10-09: "The principal ... lacks the required data action
  # Microsoft.CognitiveServices/accounts/OpenAI/responses/write". See compatibility.md B9f.
  #
  # WHY A TASK AND NOT TERRAFORM. The agent identities are created by Foundry at the first
  # version create, AFTER terraform has finished, and get fresh object ids whenever an agent
  # is recreated. Terraform cannot name them at plan time, and a data lookup would fail the
  # plan on a fresh environment. `az` is allowed here: tasks/ is operator tooling, not
  # shipped code.
  #
  # NO RECONSTRUCTED NAMES, NO GUIDS. Identities are found by the tags Foundry puts on them
  # (agentName + accountName) and filtered to the `-AgentIdentity` service principal; the
  # sibling `-AgentIdentityBlueprint` carries the same tags and must NOT be granted (the
  # blueprint authenticates to Entra, it does not call the model). Zero or more than one
  # match is an error, never a guess.
  #
  # BOTH agents get the SAME role at the SAME scope, by construction: one loop, one role,
  # one scope. Audit-vs-enforced stays the only variable.
  #
  # Cognitive Services OpenAI User (5e0bd9bd-...) carries OpenAI/responses/* and is the
  # narrowest built-in role that includes responses/write.
  #############################################

  agent-access-plan:
    desc: READ-ONLY. Show which agent identities lack model access on the account
    cmds:
      - task: _agent-access
        vars: {APPLY: 'false'}

  agent-access-up:
    desc: Grant Cognitive Services OpenAI User on the account to both agent identities (idempotent)
    cmds:
      - task: _agent-access
        vars: {APPLY: 'true'}

  _agent-access:
    internal: true
    requires:
      vars: [APPLY]
    cmds:
      - |
        set -eu
        ROLE_ID=5e0bd9bd-7b93-4f28-af87-19fc36ad61bd
        T="terraform -chdir=./{{.CLOUD_DIR}} output -raw"
        SCOPE=$($T foundry_account_id)
        ACCOUNT=$($T foundry_account_name)
        PROJECT=$($T project_name)
        FAIL=0
        for AGENT in $($T agent_name_audit) $($T agent_name_enforced); do
          IDS=$(az ad sp list \
            --filter "tags/any(t:t eq 'agentName:$AGENT') and tags/any(t:t eq 'accountName:$ACCOUNT') and tags/any(t:t eq 'projectName:$PROJECT')" \
            --query "[?ends_with(displayName,'-AgentIdentity')].id" -o tsv --only-show-errors)
          N=$(printf '%s\n' "$IDS" | grep -c . || true)
          if [ "$N" -ne 1 ]; then
            echo "$AGENT: expected exactly 1 agent identity, found $N. Has a version been created yet?" >&2
            FAIL=1
            continue
          fi
          HAVE=$(az role assignment list --assignee "$IDS" --scope "$SCOPE" \
            --query "[?roleDefinitionId!=null && ends_with(roleDefinitionId,'$ROLE_ID')] | length(@)" -o tsv --only-show-errors)
          if [ "$HAVE" != "0" ]; then
            echo "$AGENT ($IDS): already has Cognitive Services OpenAI User on the account"
          elif [ "{{.APPLY}}" = "true" ]; then
            az role assignment create --assignee-object-id "$IDS" --assignee-principal-type ServicePrincipal \
              --role "$ROLE_ID" --scope "$SCOPE" --only-show-errors -o none
            echo "$AGENT ($IDS): GRANTED Cognitive Services OpenAI User on the account"
          else
            echo "$AGENT ($IDS): MISSING Cognitive Services OpenAI User on the account (plan only, nothing changed)"
          fi
        done
        exit $FAIL

  #############################################
  # Client harness on AKS (deploy/kustomize/base)
  #
  # kubectl + kustomize, NOT terraform.
  #
  # WHY IT MOVED. The cluster workloads used to be an `infra/k8s` terraform root module.
  # hashicorp/kubernetes 2.38.0 on terraform 1.16.4 wrote `kubernetes_deployment_v1.harness`
  # into state TAINTED and with a null `identity` block, after its first apply failed on the
  # rollout wait. Every refresh afterwards read back the real identity
  # (apps/v1 Deployment agent-harness) and terraform core rejected the delta with
  # `Unexpected Identity Change`. The module could not be planned again without editing the
  # state file by hand. Manifests have no state to corrupt.
  #
  # HOW VALUES GET IN. The manifests carry committed REPLACE_WITH_* placeholders and are
  # NEVER mutated on disk. Each task streams `kustomize build` through `sed` into kubectl,
  # substituting from `terraform output -raw` against infra/cloud. The two secrets — the
  # diagnostics token and the App Insights connection string — exist only inside that pipe.
  #
  # Needs a kubeconfig: `task cloud:kubeconfig` once, which needs kubelogin because the
  # cluster has local accounts disabled. That is operator authentication; nothing inside a
  # container uses a CLI.
  #
  # SERVER-SIDE APPLY, ALWAYS. See _harness-stream for why, and read it before the first
  # run against objects terraform created.
  #############################################

  harness-plan:
    desc: Show what applying the client harness would do (changes nothing)
    cmds:
      - task: _require-kubectl
      # Server-side dry run: the API server runs admission and reports created / configured
      # / unchanged per object, without persisting anything.
      #
      # Deliberately NOT `kubectl diff`. A diff of this stream prints the Secret's contents
      # to the terminal and into any captured demo log. A dry-run apply tells you whether
      # the apply will be accepted, which is the question this task is for. It does NOT
      # prove field-level convergence — it will not tell you that a field is about to
      # change, only that the object is about to be written.
      - task: _harness-stream
        vars:
          KUBECTL_ARGS: apply --server-side --force-conflicts --dry-run=server

  harness-up:
    desc: CHANGES THE CLUSTER. Apply the client harness pod and its deploy init container
    prompt: This creates the harness pod, whose init container publishes BOTH agent versions to the Foundry data plane. Continue?
    cmds:
      # The init container is what actually creates the agent versions, so this is the step
      # that makes the policies apply to something. Until it has run, both RAI policies
      # exist but are attached to nothing and nothing is enforced.
      - task: _require-kubectl
      - task: _harness-stream
        vars:
          KUBECTL_ARGS: apply --server-side --force-conflicts
      - task: harness-status

  a2a-card:
    desc: READ-ONLY. Fetch the A2A agent card of the audit agent from inside the harness pod
    cmds:
      - task: _a2a-spike
        vars:
          SPIKE_ARGS: ""

  a2a-enable:
    desc: CHANGES AZURE. PATCH the audit agent to enable incoming A2A, then fetch its card
    prompt: This sends a merge-patch to the audit agent on the Foundry data plane. Continue?
    cmds:
      - task: _a2a-spike
        vars:
          SPIKE_ARGS: "--enable"

  a2a-disable:
    desc: CHANGES AZURE. Turn native A2A OFF on the audit agent (merge-patch). Then run cloud:a2a-card, expect endpoint-protocol-not-enabled
    prompt: This PATCHes the audit agent to remove its A2A endpoint configuration. Continue?
    cmds:
      - task: _a2a-spike
        vars:
          SPIKE_ARGS: "--disable"

  a2a-send:
    desc: CALLS THE AGENT. Send one A2A message to the audit agent (A2A-Version 1.0)
    prompt: This invokes the audit agent once over A2A. Continue?
    cmds:
      - task: _a2a-spike
        vars:
          SPIKE_ARGS: "--send"

  a2a-send-options:
    desc: CALLS THE AUDIT AGENT 3 times. Try each advertised A2A binding/version once, no retries
    prompt: This invokes the audit agent once per advertised option (JSONRPC 1.0, JSONRPC 0.3, HTTP+JSON 0.3). Continue?
    cmds:
      - task: _a2a-spike
        vars:
          SPIKE_ARGS: "--send --send-option all"

  _a2a-spike:
    internal: true
    cmds:
      # Runs in the harness pod because the Foundry data plane is private. Uses the
      # deploy venv, where azure-ai-projects and the a2a extra live. Names come from
      # terraform outputs; nothing is rebuilt from strings here. The spike has no pass.
      - |
        set -eu
        TF="terraform -chdir=./{{.CLOUD_DIR}} output -raw"
        NS=$($TF kubernetes_namespace)
        DEP=$(kubectl -n "$NS" get deployment -l "app.kubernetes.io/name=agent-harness" -o name | head -1)
        kubectl -n "$NS" exec "$DEP" -c harness -- /opt/deploy-venv/bin/python -m containment_demo.a2a_spike \
          --account "$($TF foundry_account_name)" \
          --project "$($TF project_name)" \
          --agent "$($TF agent_name_audit)" {{.SPIKE_ARGS}}

  harness-status:
    desc: Show the harness pod and the deploy init container's result
    cmds:
      # Needs a kubeconfig: run `task cloud:kubeconfig` once first.
      #
      # The deployment is found BY LABEL, not by a name rebuilt here. The name lives in
      # deploy/kustomize/base/deployment.yaml and in exactly one place.
      - |
        set -eu
        NS=$(terraform -chdir=./{{.CLOUD_DIR}} output -raw kubernetes_namespace)
        DEP=$(kubectl -n "$NS" get deployment -l "app.kubernetes.io/name=agent-harness" -o name | head -1)
        if [ -z "$DEP" ]; then
          echo "No harness deployment in namespace $NS. Run 'task cloud:harness-up'."
          exit 0
        fi
        kubectl -n "$NS" get pods -l "app.kubernetes.io/name=agent-harness" -o wide
        echo

        # The pod is chosen explicitly, newest first, and NAMED in the output.
        #
        # Reading logs from the deployment lets kubectl pick for us, and during a rollout
        # it picks arbitrarily -- in practice the OLD, dying pod. The result was logs from
        # a pod that had nothing to do with the apply just performed, under a heading that
        # implied otherwise.
        PODS=$(kubectl -n "$NS" get pods -l "app.kubernetes.io/name=agent-harness" \
          --sort-by=.metadata.creationTimestamp -o name)
        COUNT=$(printf '%s\n' "$PODS" | grep -c . || true)
        POD=$(printf '%s\n' "$PODS" | tail -1)
        if [ "$COUNT" -gt 1 ]; then
          echo "ROLLOUT IN PROGRESS: $COUNT pods. Older pods belong to a previous apply"
          echo "and their logs describe a workload you are no longer deploying."
          echo
        fi

        echo "=== agent-deploy init container ($POD) ==="
        LOGS=$(kubectl -n "$NS" logs "$POD" -c agent-deploy --tail=200 2>&1 || true)
        if [ -z "$LOGS" ]; then
          # An empty read is not an empty result. Silence here previously looked like
          # a clean run.
          echo "NO OUTPUT. This is not evidence that the deploy succeeded."
          echo "The container may not have started yet, or may have been restarted."
          echo "Try the previous attempt:"
          echo "  kubectl -n $NS logs $POD -c agent-deploy --previous"
          echo "  kubectl -n $NS describe $POD"
        else
          printf '%s\n' "$LOGS"
        fi
        echo
        echo "An init container that exited 0 means a version was ACCEPTED. It does not"
        echo "mean the RAI policy on that version is being enforced. Read the version back."

  harness-watch:
    desc: Follow the deploy init container until it finishes. Ctrl-C to stop.
    vars:
      # Override with: task cloud:harness-watch INTERVAL=10
      INTERVAL: '{{.INTERVAL | default "5"}}'
    cmds:
      # Needs a kubeconfig: run `task cloud:kubeconfig` once first.
      - |
        set -eu
        NS=$(terraform -chdir=./{{.CLOUD_DIR}} output -raw kubernetes_namespace)
        echo "Watching namespace $NS every {{.INTERVAL}}s. Ctrl-C to stop."
        echo

        # Only CHANGES are printed. A watcher that reprints an unchanged line every
        # few seconds trains you to stop reading it, which defeats the point.
        LAST=""
        LAST_POD=""
        while true; do
          POD=$(kubectl -n "$NS" get pods -l "app.kubernetes.io/name=agent-harness" \
            --sort-by=.metadata.creationTimestamp -o name 2>/dev/null | tail -1 || true)

          if [ -z "$POD" ]; then
            LINE="no harness pod in $NS"
          else
            # A pod swap mid-watch means the deploy RESTARTED FROM ZERO. Any progress
            # reported against the previous pod no longer refers to anything running.
            if [ -n "$LAST_POD" ] && [ "$POD" != "$LAST_POD" ]; then
              echo "$(date -u +%H:%M:%SZ)  POD REPLACED: $LAST_POD -> $POD"
              echo "                 The deploy started over. Elapsed time resets."
            fi
            LAST_POD="$POD"

            PHASE=$(kubectl -n "$NS" get "$POD" -o jsonpath='{.status.phase}' 2>/dev/null || true)
            WAIT=$(kubectl -n "$NS" get "$POD" \
              -o jsonpath='{.status.initContainerStatuses[0].state.waiting.reason}' 2>/dev/null || true)
            T_REASON=$(kubectl -n "$NS" get "$POD" \
              -o jsonpath='{.status.initContainerStatuses[0].state.terminated.reason}' 2>/dev/null || true)
            CODE=$(kubectl -n "$NS" get "$POD" \
              -o jsonpath='{.status.initContainerStatuses[0].state.terminated.exitCode}' 2>/dev/null || true)
            RST=$(kubectl -n "$NS" get "$POD" \
              -o jsonpath='{.status.initContainerStatuses[0].restartCount}' 2>/dev/null || true)

            if [ -n "$T_REASON" ]; then
              STATE="$T_REASON (exit $CODE)"
            elif [ -n "$WAIT" ]; then
              STATE="$WAIT"
            else
              STATE="Running"
            fi
            LINE="${POD#pod/}  pod=$PHASE  agent-deploy=$STATE  restarts=${RST:-0}"
          fi

          if [ "$LINE" != "$LAST" ]; then
            echo "$(date -u +%H:%M:%SZ)  $LINE"
            LAST="$LINE"
          fi

          # Terminated is the only stopping condition. A Running init container is
          # not a result, however long it has been running.
          if [ -n "${T_REASON:-}" ]; then
            echo
            echo "=== agent-deploy final output ($POD) ==="
            LOGS=$(kubectl -n "$NS" logs "$POD" -c agent-deploy --tail=60 2>&1 || true)
            if [ -z "$LOGS" ]; then
              echo "NO OUTPUT. This is not evidence of what happened."
              echo "  kubectl -n $NS logs $POD -c agent-deploy --previous"
            else
              printf '%s\n' "$LOGS"
            fi
            echo
            if [ "${CODE:-1}" = "0" ]; then
              echo "Exit 0: a version was ACCEPTED. It does not mean the RAI policy on"
              echo "that version is being enforced. Read the version back."
              exit 0
            fi
            echo "Exit ${CODE:-?}: the deploy FAILED. The cause is above, not here."
            exit 1
          fi

          sleep {{.INTERVAL}}
        done

  harness-down:
    desc: Removes the harness pod and its namespace. Leaves the cluster and the agent versions alone.
    prompt: This deletes the harness namespace. Agent versions already published stay published. Continue?
    cmds:
      # Deleting the namespace removes the Deployment, the Secret and the ServiceAccount
      # with it. There is no state file to clean up afterwards, which is the point.
      - |
        set -eu
        NS=$(terraform -chdir=./{{.CLOUD_DIR}} output -raw kubernetes_namespace)
        kubectl delete namespace "$NS" --ignore-not-found --wait=false
        echo "Namespace $NS deleted. Published agent versions are untouched."

  _harness-stream:
    internal: true
    vars:
      # Resolved here rather than in the script below so the digest lookup is a shared,
      # guarded task instead of a second place that parses `az` output.
      ACR_NAME:
        sh: terraform -chdir=./{{.CLOUD_DIR}} output -raw acr_name
      DIGEST_FILE:
        sh: mktemp
      EXPLICIT_DIGEST:
        sh: printf '%s' "${AGENT_IMAGE_DIGEST:-}"
    # Renders the manifests and pipes them into kubectl. Nothing is written to disk.
    #
    # SERVER-SIDE APPLY, with --force-conflicts, on purpose and in both directions:
    #
    #   First run against the objects terraform created. Those objects were written by the
    #   field manager `Terraform` and carry NO
    #   `kubectl.kubernetes.io/last-applied-configuration` annotation. A client-side
    #   `kubectl apply` would have no prior state to three-way-merge against and would
    #   behave unpredictably on fields terraform set. Server-side apply reads the real
    #   managedFields, and --force-conflicts transfers ownership of every field in this
    #   stream from `Terraform` to `kubectl`. That is the adoption step. The objects keep
    #   running; only the ownership metadata changes.
    #
    #   Steady state. Once ownership has transferred, --force-conflicts is a no-op for this
    #   stream, because nothing else manages these fields. It is left in so the flags do not
    #   differ between the first run and every later one — a first-run-only flag is a flag
    #   someone will forget, on the one run where it matters.
    #
    # The sed delimiter is `|` because ARM resource IDs and URLs contain `/`. A value
    # containing a literal `|` or `&` would corrupt the substitution; none of these can
    # (ARM IDs, GUIDs, hostnames, an App Insights connection string, a hex token).
    cmds:
      - task: arm:_acr-digest
        vars:
          ACR: '{{.ACR_NAME}}'
          REPOSITORY: '{{.AGENT_IMAGE_REPOSITORY | default "containment-demo-agent"}}'
          TAG: '{{.IMAGE_TAG | default "latest"}}'
          EXPLICIT: '{{.EXPLICIT_DIGEST}}'
          OUT: '{{.DIGEST_FILE}}'
      - |
        set -eu

        TF="terraform -chdir=./{{.CLOUD_DIR}} output -raw"

        # The experiment's control. Both agent versions must pin the SAME digest, so it is
        # resolved live from ACR by arm:_acr-digest rather than defaulting to anything.
        # A stale fallback would deploy code that is not what was built, and the
        # plan-cleanliness check could not catch it -- the infrastructure would be
        # identical either way. An explicit AGENT_IMAGE_DIGEST still wins, and is
        # validated by that same task.
        DIGEST=$(cat "{{.DIGEST_FILE}}")
        rm -f "{{.DIGEST_FILE}}"
        case "$DIGEST" in
          sha256:*) ;;
          *) echo "Digest did not resolve to sha256:<64 hex>, got '$DIGEST'." >&2
             echo "Tags are mutable; two agent versions running different code would make" >&2
             echo "the RAI policy no longer the only variable. Read the current digest with" >&2
             echo "'task build:agent-digest'." >&2
             exit 1 ;;
        esac

        ACR=$($TF acr_login_server)
        AGENT_IMAGE="${ACR}/${AGENT_IMAGE_REPOSITORY:-containment-demo-agent}@${DIGEST}"

        NAMESPACE=$($TF kubernetes_namespace)
        SERVICE_ACCOUNT=$($TF agent_deployer_service_account)
        CLIENT_ID=$($TF agent_deployer_client_id)
        FOUNDRY_ACCOUNT=$($TF foundry_account_name)
        FOUNDRY_PROJECT=$($TF project_name)
        FOUNDRY_ENDPOINT=$($TF foundry_endpoint)
        AGENT_AUDIT=$($TF agent_name_audit)
        AGENT_ENFORCED=$($TF agent_name_enforced)
        RAI_AUDIT=$($TF rai_policy_audit_id)
        RAI_ENFORCED=$($TF rai_policy_enforced_id)
        POLICY_API_URL=$($TF policy_api_url)
        TEST_RECEIVER_URL=$($TF test_receiver_url)
        MODEL_DEPLOYMENT=$($TF model_deployment_name)

        # Secrets. Read into shell variables and never written anywhere else.
        DIAG_TOKEN=$($TF diagnostics_token)
        APPINSIGHTS=$($TF application_insights_connection_string)

        # Kubernetes does not restart pods when a Secret changes. This annotation does,
        # exactly when one of the two secret values is different from last time.
        CONFIG_HASH=$(printf '%s\n%s' "$DIAG_TOKEN" "$APPINSIGHTS" | sha256sum | cut -d' ' -f1)

        # Rendered once into a variable so the placeholder check below inspects the stream
        # that is actually about to be applied. Checking `kustomize build` on its own would
        # re-read the unsubstituted source and count every placeholder every time, which
        # can never fail and therefore guards nothing.
        RENDERED=$(kustomize build deploy/kustomize/base \
          | sed -e "s|REPLACE_WITH_NAMESPACE|${NAMESPACE}|g" \
                -e "s|REPLACE_WITH_SERVICE_ACCOUNT|${SERVICE_ACCOUNT}|g" \
                -e "s|REPLACE_WITH_AGENT_DEPLOYER_CLIENT_ID|${CLIENT_ID}|g" \
                -e "s|REPLACE_WITH_AGENT_IMAGE|${AGENT_IMAGE}|g" \
                -e "s|REPLACE_WITH_FOUNDRY_ACCOUNT_NAME|${FOUNDRY_ACCOUNT}|g" \
                -e "s|REPLACE_WITH_FOUNDRY_PROJECT_NAME|${FOUNDRY_PROJECT}|g" \
                -e "s|REPLACE_WITH_FOUNDRY_ENDPOINT|${FOUNDRY_ENDPOINT}|g" \
                -e "s|REPLACE_WITH_AGENT_NAME_AUDIT|${AGENT_AUDIT}|g" \
                -e "s|REPLACE_WITH_AGENT_NAME_ENFORCED|${AGENT_ENFORCED}|g" \
                -e "s|REPLACE_WITH_RAI_POLICY_AUDIT_ID|${RAI_AUDIT}|g" \
                -e "s|REPLACE_WITH_RAI_POLICY_ENFORCED_ID|${RAI_ENFORCED}|g" \
                -e "s|REPLACE_WITH_POLICY_API_URL|${POLICY_API_URL}|g" \
                -e "s|REPLACE_WITH_TEST_RECEIVER_URL|${TEST_RECEIVER_URL}|g" \
                -e "s|REPLACE_WITH_MODEL_DEPLOYMENT|${MODEL_DEPLOYMENT}|g" \
                -e "s|REPLACE_WITH_CONFIG_HASH|${CONFIG_HASH}|g" \
                -e "s|REPLACE_WITH_DIAGNOSTICS_TOKEN|${DIAG_TOKEN}|g" \
                -e "s|REPLACE_WITH_APPINSIGHTS_CONNECTION_STRING|${APPINSIGHTS}|g")

        # A placeholder that survived substitution would reach the cluster as a literal --
        # a pod that cannot pull `REPLACE_WITH_AGENT_IMAGE`, or worse, an agent pointed at
        # a hostname that is not the one under test. Caught BEFORE the apply, not after.
        #
        # Only placeholder NAMES are printed. The values they would have carried are not,
        # because two of them are secrets.
        LEFTOVER=$(printf '%s\n' "$RENDERED" | grep -o 'REPLACE_WITH_[A-Z0-9_]*' | sort -u || true)
        if [ -n "$LEFTOVER" ]; then
          echo "Refusing to apply: these placeholders were not substituted." >&2
          echo "$LEFTOVER" >&2
          echo "Each one needs a matching 'terraform output -raw' in this task." >&2
          exit 1
        fi

        printf '%s\n' "$RENDERED" | kubectl {{.KUBECTL_ARGS}} -f -

  _require-kubectl:
    internal: true
    cmds:
      - |
        for TOOL in kubectl kustomize; do
          command -v "$TOOL" >/dev/null 2>&1 || {
            echo "$TOOL not found on PATH. The cluster workloads are applied with"
            echo "kubectl + kustomize; there is no terraform module for them."
            exit 1
          }
        done
        kubectl config current-context >/dev/null 2>&1 || {
          echo "No kubeconfig context. Run 'task cloud:kubeconfig' first."
          exit 1
        }

  _require-kubelogin:
    internal: true
    cmds:
      - |
        command -v kubelogin >/dev/null 2>&1 || {
          echo "kubelogin not found on PATH."
          echo "The cluster runs with local accounts disabled, so there is no admin"
          echo "kubeconfig to fall back on. Install it and retry."
          exit 1
        }

  down:
    desc: DELETES EVERYTHING this module created, and removes local state
    prompt: This deletes the entire demo environment including the AKS cluster and the Foundry account. Continue?
    dir: '{{.CLOUD_DIR}}'
    cmds:
      # Deleted by tag rather than by terraform destroy, so a partial or failed apply
      # still cleans up. The tag is the demo's own, never the spike's.
      - az group list --tag Application="{{.TITLE}}" --query "[].name" -o tsv | xargs --no-run-if-empty -ot -n 1 az group delete -y --no-wait -n || true
      - rm -rf terraform.tfstate.d .terraform.lock.hcl .terraform terraform.tfstate terraform.tfstate.backup .terraform.tfstate.lock.info terraform.tfstate.* || true
      # Nothing to clean up for the cluster workloads. They are manifests applied with
      # kubectl and hold no state; the objects die with the cluster.
