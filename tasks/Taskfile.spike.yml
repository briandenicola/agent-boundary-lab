version: '3'

# Stage 1 composability probe.
#
# This creates billable Azure resources. It is cheap and short-lived, but it is real, so
# nothing here runs without being asked for explicitly. There is no task that applies as
# a side effect of planning or showing output.
#
# Tear it down the same day with `task spike:down`. It uses its own Application tag, so
# teardown cannot reach the main demo environment.

env:
  SPIKE_DIR: infra/spike
  # Confirm the real value for your account with `task spike:base-policies` before
  # applying. A custom RAI policy must derive from a base policy that actually exists.
  RAI_BASE_POLICY: '{{default "Microsoft.DefaultV2" .RAI_BASE_POLICY}}' 

tasks:
  default:
    desc: Show available spike tasks
    cmds:
      - task --list

  whoami:
    desc: Show which subscription and tenant an apply would target
    cmds:
      - az account show --query "{subscription:name, id:id, tenant:tenantId, user:user.name}" -o table

  init:
    desc: Initialise terraform for the spike
    cmds:
      - terraform -chdir=./{{.SPIKE_DIR}} init -upgrade

  base-policies:
    desc: List the RAI base policies that exist on the spike's Foundry account
    cmds:
      # A read, not a change. The account is found by tag rather than by terraform
      # output, so this still works after a partially failed apply.
      - |
        set -eu
        ACCOUNT_ID=$(az resource list \
          --tag Application="{{.SPIKE_TITLE}}" \
          --query "[?type=='Microsoft.CognitiveServices/accounts'] | [0].id" -o tsv)
        if [ -z "$ACCOUNT_ID" ]; then
          echo "No Foundry account found with tag Application='{{.SPIKE_TITLE}}'."
          exit 1
        fi
        echo "account: $ACCOUNT_ID"
        echo
        echo "=== existing RAI policies, and which are usable as a base ==="
        az rest --method get \
          --url "https://management.azure.com${ACCOUNT_ID}/raiPolicies?api-version=2026-05-15-preview" \
          --query "value[].{name:name, type:properties.type, basePolicy:properties.basePolicyName, mode:properties.mode, egress:properties.egressPolicy}" \
          -o json

  show-base:
    desc: Dump a base RAI policy in full, to copy its contentFilters verbatim
    cmds:
      # A read. A custom policy must supply contentFilters, and they must be IDENTICAL
      # across our two policies - content filtering is not the variable under test, so
      # any difference there would confound the egress result. Copying the base policy's
      # own filters is the most defensible way to hold them constant.
      - |
        set -eu
        ACCOUNT_ID=$(az resource list \
          --tag Application="{{.SPIKE_TITLE}}" \
          --query "[?type=='Microsoft.CognitiveServices/accounts'] | [0].id" -o tsv)
        if [ -z "$ACCOUNT_ID" ]; then
          echo "No Foundry account found with tag Application='{{.SPIKE_TITLE}}'."
          exit 1
        fi
        echo "=== {{.BASE}} in full ==="
        az rest --method get \
          --url "https://management.azure.com${ACCOUNT_ID}/raiPolicies/{{.BASE}}?api-version=2026-05-15-preview" \
          -o json
    vars:
      BASE: '{{default "Microsoft.DefaultV2" .CLI_ARGS}}'

  plan:
    desc: Show what the spike would create (creates nothing)
    cmds:
      - task: init
      - terraform -chdir=./{{.SPIKE_DIR}} plan -compact-warnings -var "region={{.REGION}}" -var "rai_base_policy_name={{.RAI_BASE_POLICY}}"
    vars:
      REGION: '{{default .DEFAULT_REGION .CLI_ARGS}}'

  up:
    desc: CREATES BILLABLE RESOURCES. Apply the stage 1 probe, then show the result
    prompt: This creates a Foundry account and two RAI policies in Azure. Continue?
    cmds:
      - task: init
      - terraform -chdir=./{{.SPIKE_DIR}} apply -auto-approve -compact-warnings -var "region={{.REGION}}" -var "rai_base_policy_name={{.RAI_BASE_POLICY}}"
      - task: result
    vars:
      REGION: '{{default .DEFAULT_REGION .CLI_ARGS}}'

  result:
    desc: Show what ARM actually stored, which is the point of the probe
    cmds:
      - |
        echo "=== did ARM keep the managed VNet configuration? ==="
        terraform -chdir=./{{.SPIKE_DIR}} output -json stored_network_injections
        echo
        echo "=== did ARM keep the Audit egress policy? ==="
        terraform -chdir=./{{.SPIKE_DIR}} output -json stored_egress_policy_audit
        echo
        echo "=== did ARM keep the Enforced egress policy? ==="
        terraform -chdir=./{{.SPIKE_DIR}} output -json stored_egress_policy_enforced
        echo
        terraform -chdir=./{{.SPIKE_DIR}} output -raw finding
        echo

  down:
    desc: Delete everything the spike created and remove local state
    dir: '{{.SPIKE_DIR}}'
    cmds:
      # Deleted by tag rather than by terraform destroy, so a partial or failed apply
      # still cleans up. The tag is the spike's own, never the main demo's.
      - az group list --tag Application="{{.SPIKE_TITLE}}" --query "[].name" -o tsv | xargs --no-run-if-empty -ot -n 1 az group delete -y --no-wait -n || true
      - rm -rf terraform.tfstate.d .terraform.lock.hcl .terraform terraform.tfstate terraform.tfstate.backup .terraform.tfstate.lock.info terraform.tfstate.* || true
