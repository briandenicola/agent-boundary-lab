<svg xmlns="http://www.w3.org/2000/svg" width="1510" height="1050" viewBox="0 0 1510 1050" role="img" aria-labelledby="title description">
<title id="title">Copilot Deployment Flow</title>
<desc id="description">Dated 2026-11-10. Architecture map, not evidence. Open the matching .excalidraw file to edit the authoritative scene.</desc>
