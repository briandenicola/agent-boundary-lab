version: '3'

# Task echoes every command by default, so anything that prints its own
# output shows up twice. These tasks are written to be read by a human
# watching a demo, so the command itself is noise.
silent: true

# Everything here is local and free. No Azure access, no network, no billable resources.

tasks:
  default:
    desc: Show available lint tasks
    cmds:
      - task --list

  all:
    desc: Run every local check
    cmds:
      - task: format
      - task: ruff
      - task: types
      - task: test
      - task: terraform
      - task: manifests
      - task: no-az

  format:
    desc: Check formatting
    cmds:
      - .venv/bin/python -m ruff format --check src services tests scripts

  fix:
    desc: Apply formatting and safe lint fixes
    cmds:
      - .venv/bin/python -m ruff format src services tests scripts
      - .venv/bin/python -m ruff check --fix src services tests scripts

  ruff:
    desc: Lint
    cmds:
      - .venv/bin/python -m ruff check src services tests scripts

  types:
    desc: Type-check
    cmds:
      - .venv/bin/python -m mypy src services

  test:
    desc: Run the unit suite. Needs no credentials, no network, no Azure
    cmds:
      - .venv/bin/python -m pytest tests/unit -q

  terraform:
    desc: Validate and format-check the terraform
    vars:
      MODULES: spike cloud
    cmds:
      - terraform fmt -check -recursive infra
      - |
        for M in {{.MODULES}}; do
          printf '%-8s ' "$M"
          terraform -chdir="./infra/$M" init -backend=false -upgrade >/dev/null
          terraform -chdir="./infra/$M" validate -no-color | head -1
        done

  manifests:
    desc: Build the kustomize base and check every placeholder is substituted by a task
    # The cluster workloads are manifests, not terraform, so `lint:terraform` cannot see
    # them. Two things are checked here, both of which have a real failure mode:
    #
    #   1. The base builds and kubectl accepts the result. `--validate=ignore` keeps this
    #      offline: schema validation would reach for the API server's OpenAPI document,
    #      and no local check in this repo is allowed to need a cluster.
    #   2. Every REPLACE_WITH_* token in the manifests has a matching substitution in
    #      tasks/Taskfile.cloud.yml. A placeholder nobody substitutes reaches the cluster
    #      as a literal string — a pod that cannot pull `REPLACE_WITH_AGENT_IMAGE`, or
    #      worse, an empty-looking value that applies cleanly and is wrong.
    cmds:
      - |
        set -eu
        command -v kustomize >/dev/null 2>&1 || { echo "kustomize not on PATH"; exit 1; }
        kustomize build deploy/kustomize/base \
          | sed -e 's|REPLACE_WITH_[A-Z_]*|lint-placeholder|g' \
          | kubectl apply --dry-run=client --validate=ignore -f - >/dev/null
        kustomize build deploy/kustomize/a2a-facade \
          | sed -e 's|REPLACE_WITH_[A-Z_]*|lint-placeholder|g' \
          | kubectl apply --dry-run=client --validate=ignore -f - >/dev/null
        kustomize build deploy/kustomize/local-model \
          | sed -e 's|REPLACE_WITH_[A-Z_]*|lint-placeholder|g' \
          | kubectl apply --dry-run=client --validate=ignore -f - >/dev/null
        kustomize build deploy/kustomize/harness \
          | sed -e 's|REPLACE_WITH_[A-Z_]*|lint-placeholder|g' \
          | kubectl apply --dry-run=client --validate=ignore -f - >/dev/null
        HARNESS_MISSING=""
        for TOKEN in $(grep -rohE 'REPLACE_WITH_[A-Z_]+' deploy/kustomize/harness | sort -u); do
          grep -q "$TOKEN" tasks/Taskfile.harness.yml || HARNESS_MISSING="$HARNESS_MISSING $TOKEN"
        done
        if [ -n "$HARNESS_MISSING" ]; then
          echo "Harness placeholders with no substitution in tasks/Taskfile.harness.yml:$HARNESS_MISSING"
          exit 1
        fi
        FACADE_MISSING=""
        for TOKEN in $(grep -rohE 'REPLACE_WITH_[A-Z_]+' deploy/kustomize/a2a-facade | sort -u); do
          grep -q "$TOKEN" tasks/Taskfile.a2a.yml || FACADE_MISSING="$FACADE_MISSING $TOKEN"
        done
        if [ -n "$FACADE_MISSING" ]; then
          echo "Facade placeholders with no substitution in tasks/Taskfile.a2a.yml:$FACADE_MISSING"
          exit 1
        fi
        MISSING=""
        for TOKEN in $(grep -ohE 'REPLACE_WITH_[A-Z_]+' deploy/kustomize/base/*.yaml | sort -u); do
          grep -q "$TOKEN" tasks/Taskfile.cloud.yml || MISSING="$MISSING $TOKEN"
        done
        if [ -n "$MISSING" ]; then
          echo "Placeholders with no substitution in tasks/Taskfile.cloud.yml:$MISSING"
          exit 1
        fi
        echo "manifests build; every placeholder is substituted"

  no-az:
    desc: Fail if the Azure CLI is invoked from anything that ships
    # Deployment is Terraform or SDK only, because that is what the client uses.
    # Read-only az at a terminal is fine; it must not land in a shipped artifact.
    # tasks/ is deliberately not scanned: Taskfiles are operator tooling.
    # deploy/ IS scanned. It holds the cluster manifests, which run inside the cluster
    # and are as shipped as anything under src/. kubectl and kustomize live in tasks/,
    # which is the operator's side of the line; `az` has no business in either.
    # grep -n emits path:line:content, so stripping from the first '#' drops both
    # whole-line and trailing comments while leaving the line number intact.
    cmds:
      - |
        HITS=$(grep -rn \
          --include='*.py' --include='*.tf' --include='*.yml' \
          --include='*.yaml' --include='*.sh' --include='Dockerfile*' \
          -E '(^|[^[:alnum:]_.-])az[[:space:]]+[a-z]' \
          src services infra tests scripts samples deploy 2>/dev/null \
          | sed 's/#.*$//' \
          | grep -E '(^|[^[:alnum:]_.-])az[[:space:]]+[a-z]' || true)
        if [ -n "$HITS" ]; then
          echo "Azure CLI invoked from shipped code:"
          echo
          echo "$HITS"
          echo
          echo "Deployment is Terraform or SDK only. If this is prose, make it a"
          echo "comment. If it is a real invocation, replace it with the SDK."
          exit 1
        fi
        echo "no az CLI invocations in shipped code"

  venv:
    desc: Create the virtualenv and install dependencies
    cmds:
      # uv, not pip: google-adk and azure-ai-agentserver-core have incompatible
      # opentelemetry pins and pip cannot resolve them. See pyproject.toml.
      - uv venv --python 3.12 .venv
      - VIRTUAL_ENV=.venv uv pip install -e ".[dev,services]"
