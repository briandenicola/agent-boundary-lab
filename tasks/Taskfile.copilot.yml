version: '3'
silent: true

tasks:
  access:
    desc: CHANGES PROJECT RBAC. Grant the signed-in publishing user Foundry User on this project only
    cmds:
      - task: :cloud:target-check
      - |
        set -eu
        [ "$(az account show --query user.type -o tsv --only-show-errors)" = user ] || {
          echo "Publishing access requires your Azure CLI user login, not a service principal." >&2
          exit 1
        }
        ACCOUNT=$(terraform -chdir=infra/cloud output -raw foundry_account_id)
        PROJECT=$(terraform -chdir=infra/cloud output -raw project_name)
        case "$ACCOUNT" in
          /subscriptions/"$ARM_SUBSCRIPTION_ID"/resourceGroups/*/providers/Microsoft.CognitiveServices/accounts/*) ;;
          *) echo "Foundry state is outside the approved subscription." >&2; exit 1 ;;
        esac
        SCOPE="$ACCOUNT/projects/$PROJECT"
        ACTUAL=$(az resource show --ids "$SCOPE" --query id -o tsv --only-show-errors)
        [ "$ACTUAL" = "$SCOPE" ] || {
          echo "Foundry project scope did not match state; refusing access changes." >&2
          exit 1
        }
        USER_ID=$(az ad signed-in-user show --query id -o tsv --only-show-errors)
        printf '%s\n' "$USER_ID" | grep -qE '^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$' || {
          echo "Could not resolve a single signed-in user object ID." >&2; exit 1
        }
        ROLE_ID=53ca6127-db72-4b80-b1b0-d745d6d5456d
        HAVE=$(az role assignment list --assignee "$USER_ID" --role "$ROLE_ID" \
          --scope "$SCOPE" --query "length(@)" -o tsv --only-show-errors)
        case "$HAVE" in
          0)
            az role assignment create --assignee-object-id "$USER_ID" \
              --assignee-principal-type User --role "$ROLE_ID" --scope "$SCOPE" \
              --only-show-errors -o none
            echo "Granted Foundry User on the lab project. Allow RBAC propagation, then retry copilot:plan."
            ;;
          ''|*[!0-9]*) echo "Unrecognized role-assignment readback; refusing access changes." >&2; exit 1 ;;
          *) echo "Foundry User is already assigned on the project. Allow propagation before retrying copilot:plan." ;;
        esac

  check:
    desc: OFFLINE. Check Microsoft 365 publication guards and request-scoped chat correlation
    cmds:
      - .venv/bin/python -m pytest tests/unit/test_copilot.py tests/unit/test_protocol_adapter.py tests/unit/test_task_commands.py -q
      - task: :lint:format
      - task: :lint:ruff
      - task: :lint:types

  plan:
    desc: READ-ONLY AZURE. Plan first publication or an owned agent-version update; save a private journal
    cmds:
      - task: _run
        vars: {ACTION: plan}

  publish:
    desc: CHANGES FOUNDRY + M365. Publish to Just you, or update the existing publication's reviewed version pin
    cmds:
      - task: _run
        vars: {ACTION: publish}

  status:
    desc: READ-ONLY AZURE. Read publication journal and endpoint settings; not a chat smoke test
    cmds:
      - task: _run
        vars: {ACTION: status}

  disable:
    desc: CHANGES FOUNDRY. Restore only this publication's endpoint settings; catalog removal is a separate M365 admin action
    cmds:
      - task: _run
        vars: {ACTION: disable}

  _run:
    internal: true
    cmds:
      - task: :governance:_context
      - |
        set -eu
        : "${COPILOT_METADATA_FILE:?Copy deploy/copilot/publish-request.example.json to .task/copilot/publish-request.json, fill owner metadata, and set COPILOT_METADATA_FILE.}"
        test -f "$COPILOT_METADATA_FILE"
        [ "$(az account show --query user.type -o tsv --only-show-errors)" = user ] || {
          echo "Shared publication requires your Azure CLI user login, not a service principal." >&2
          exit 1
        }
        METADATA=$(cat "$COPILOT_METADATA_FILE")
        NS=$(terraform -chdir=infra/cloud output -raw kubernetes_namespace)
        POD=$(kubectl -n "$NS" get pods -l app.kubernetes.io/name=agent-governance \
          -o jsonpath='{.items[0].metadata.name}')
        test -n "$POD"
        mkdir -p .task/copilot
        RESULT=$(mktemp .task/copilot/readback.XXXXXX)
        JOURNAL=$(mktemp .task/copilot/journal.XXXXXX)
        TOKEN=$(mktemp .task/copilot/token.XXXXXX)
        trap 'rm -f "$RESULT" "$JOURNAL" "$TOKEN"' EXIT
        az account get-access-token --resource https://ai.azure.com \
          --query accessToken -o tsv --only-show-errors > "$TOKEN"
        kubectl -n "$NS" exec "$POD" -- mkdir -p /home/agent/.copilot
        kubectl -n "$NS" cp src/containment_demo/copilot.py \
          "$POD:/home/agent/.copilot/publisher.py"
        CODE=0
        kubectl -n "$NS" exec -i "$POD" -- \
          /opt/deploy-venv/bin/python /home/agent/.copilot/publisher.py \
          {{.ACTION}} --metadata "$METADATA" < "$TOKEN" > "$RESULT" || CODE=$?
        cat "$RESULT"
        kubectl -n "$NS" exec "$POD" -- /bin/sh -c \
          'if [ -f /home/agent/.copilot/publication.json ]; then cat /home/agent/.copilot/publication.json; fi' \
          > "$JOURNAL"
        if [ -s "$JOURNAL" ]; then
          mv "$JOURNAL" .task/copilot/publication.json
        fi
        if [ "$CODE" = 0 ]; then
          mv "$RESULT" .task/copilot/readback.json
        fi
        exit "$CODE"

  restore-journal:
    desc: CHANGES AKS HELPER ONLY. Restore the private publication journal after a helper restart; never overwrite an existing journal
    cmds:
      - task: :governance:_context
      - |
        set -eu
        test -s .task/copilot/publication.json
        NS=$(terraform -chdir=infra/cloud output -raw kubernetes_namespace)
        kubectl -n "$NS" exec deployment/agent-governance -- \
          /bin/sh -c 'test ! -e /home/agent/.copilot/publication.json && mkdir -p /home/agent/.copilot && chmod 700 /home/agent/.copilot'
        kubectl -n "$NS" cp .task/copilot/publication.json \
          "$NS/$(kubectl -n "$NS" get pods -l app.kubernetes.io/name=agent-governance -o jsonpath='{.items[0].metadata.name}'):/home/agent/.copilot/publication.json"
        kubectl -n "$NS" exec deployment/agent-governance -- \
          chmod 600 /home/agent/.copilot/publication.json
