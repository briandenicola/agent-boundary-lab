version: '3'

# Task echoes every command by default, so anything that prints its own
# output shows up twice. These tasks are written to be read by a human
# watching a demo, so the command itself is noise.
silent: true

# Image builds and endpoint deployment.
#
# Every build happens in ACR rather than on the operator's machine, so the image that
# runs is the image ACR built, and nothing depends on a local Docker daemon.
#
# BUILDS DO NOT PROMPT. Pushing a new tag into your own registry changes nothing that is
# running: the agent versions pin digests and the Container Apps keep serving whatever
# image they were last pointed at. Rebuilding is also idempotent, so a repeated or
# accidental run costs a little ACR time and nothing else. The confirmation stays on
# deploy-endpoints, which is the step that actually swaps what is serving traffic.
#
# THE AGENT IMAGE DIGEST IS THE EXPERIMENT'S CONTROL. Both agent versions must run the
# SAME digest, or the Audit and Enforced runs differ in more than the policy and the
# result proves nothing. Tags are mutable and must never be used to publish a version -
# use `task build:agent-digest` and pin what it prints.
#
# A corollary of not prompting: rebuilding `latest` moves the tag but NOT any digest a
# version already pins. If you rebuild mid-experiment, re-read the digest and confirm
# both versions still pin the same one before trusting a run.

env:
  CLOUD_DIR: infra/cloud
  # These are read from the environment at the point of use, not declared here.
  # A top-level `env:` entry of the form `VAR: '{{default X .VAR}}'` cannot see a
  # value the root Taskfile loaded from .env -- it resolves to the default and then
  # EXPORTS that over the .env value, so setting the variable in .env silently did
  # nothing. Shell expansion at the point of use reads the real environment.
  # Passed through to terraform on deploy-endpoints. Confirm the real value for your
  # account with `task cloud:base-policies`.

tasks:
  default:
    desc: Show available build tasks
    cmds:
      - task --list

  _acr:
    internal: true
    cmds:
      - terraform -chdir=./{{.CLOUD_DIR}} output -raw acr_name

  agent:
    desc: BUILDS IN AZURE. Build and push the agent image to ACR
    cmds:
      - |
        set -eu
        ACR=$(terraform -chdir=./{{.CLOUD_DIR}} output -raw acr_name)
        echo "building agent image in $ACR"
        az acr build \
          --registry "$ACR" \
          --image "containment-demo-agent:${IMAGE_TAG:-latest}" \
          --file Dockerfile \
          .
      - task: agent-digest

  services:
    desc: BUILDS IN AZURE. Build and push both controlled-endpoint images to ACR
    cmds:
      # TWO images from ONE Dockerfile. services/Dockerfile resolves the app at build
      # time, so a running container cannot be repointed at the other service; building
      # both from the same file keeps them from drifting apart in base layer or
      # dependency version, which is what makes the policy API's success a usable control
      # for the receiver's silence.
      - |
        set -eu
        ACR=$(terraform -chdir=./{{.CLOUD_DIR}} output -raw acr_name)
        for SVC in policy_api test_receiver; do
          IMG=$(echo "$SVC" | tr '_' '-')
          echo "building $SVC in $ACR"
          az acr build \
            --registry "$ACR" \
            --image "containment-demo-${IMG}:${IMAGE_TAG:-latest}" \
            --build-arg "SERVICE=${SVC}" \
            --file services/Dockerfile \
            .
        done

  all:
    desc: BUILDS IN AZURE. Build both images
    cmds:
      - task: agent
      - task: services

  agent-digest:
    desc: Print the agent image digest. This is what both agent versions must pin.
    cmds:
      - |
        set -eu
        ACR=$(terraform -chdir=./{{.CLOUD_DIR}} output -raw acr_name)
        SERVER=$(terraform -chdir=./{{.CLOUD_DIR}} output -raw acr_login_server)
        DIGEST=$(az acr repository show \
          --name "$ACR" \
          --image "containment-demo-agent:${IMAGE_TAG:-latest}" \
          --query digest -o tsv)
        echo
        echo "=== pin THIS in both agent versions ==="
        echo "${SERVER}/containment-demo-agent@${DIGEST}"
        echo
        echo "Deploying a tag instead would let the two versions run different code,"
        echo "which makes the egress policy no longer the only variable between them."

  deploy-endpoints:
    desc: CHANGES AZURE. Point both Container Apps at their built images, via terraform
    prompt: This runs `terraform apply` with the endpoint image tag set, updating both controlled endpoints. Continue?
    cmds:
      # TERRAFORM, NOT `az containerapp update`. Two reasons, and the second is the one
      # that actually bit us.
      #
      # 1. Terraform owns these Container Apps. Setting --image out of band meant it owned
      #    the app but not what the app ran, so the next `cloud:up` either reverted the
      #    image or showed drift forever.
      # 2. The old task rebuilt the app name as "${RESOURCE_NAME}-policy-api". Container
      #    App names cap at 32 characters, so the real name is truncated —
      #    `humble-phoenix-466-policy-api`, not `humble-phoenix-46689-policy-api` — and
      #    the update failed with "The containerapp does not exist". Terraform already
      #    knows both names. Nothing here concatenates one.
      #
      # This is a FULL apply, not a targeted one. A targeted apply would skip the ACR role
      # assignments the apps need in order to pull, and "idempotent" has to mean the whole
      # module, not a corner of it.
      - |
        set -eu
        echo "applying endpoint_image_tag=${IMAGE_TAG:-latest} to {{.CLOUD_DIR}}"
        terraform -chdir=./{{.CLOUD_DIR}} apply -auto-approve -compact-warnings \
          -var "region={{.REGION}}" \
          -var "rai_base_policy_name=${RAI_BASE_POLICY:-Microsoft.DefaultV2}" \
          -var "endpoint_image_tag=${IMAGE_TAG:-latest}"
      - |
        echo
        echo "Put this in your .env so a later 'task cloud:up' does not roll the endpoints"
        echo "back to the placeholder image:"
        echo
        echo "    ENDPOINT_IMAGE_TAG=${IMAGE_TAG:-latest}"
      - task: check-endpoints
    vars:
      REGION: '{{default .DEFAULT_REGION .CLI_ARGS}}'

  check-endpoints:
    desc: Confirm both endpoints are live before trusting any run that uses them
    cmds:
      # Run this BEFORE a demo run, never after a failure. An endpoint that was already
      # down makes a failed call unattributable: the agent would have failed to reach it
      # whether or not any policy existed.
      #
      # Retries for up to two minutes. `az containerapp update` returns once the control
      # plane has accepted the new revision, which is well before that revision answers
      # traffic, so checking immediately after a deploy reports UNREACHABLE for an
      # endpoint that is merely still starting. In a repository whose entire output is
      # "reachable" versus "not reachable", a false negative here is worse than a slow
      # check, and it also exits non-zero so a failure cannot be scrolled past.
      - |
        set -eu
        POLICY=$(terraform -chdir=./{{.CLOUD_DIR}} output -raw policy_api_url)
        RECEIVER=$(terraform -chdir=./{{.CLOUD_DIR}} output -raw test_receiver_url)

        DEADLINE=$(( $(date +%s) + 120 ))
        FAILED=0

        for URL in "$POLICY" "$RECEIVER"; do
          printf '%s/healthz -> ' "$URL"
          BODY=""
          while :; do
            if BODY=$(curl --silent --show-error --fail --max-time 10 "$URL/healthz" 2>/dev/null); then
              echo "$BODY"
              break
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "UNREACHABLE after 120s"
              FAILED=1
              break
            fi
            printf '.'
            sleep 5
          done
        done

        echo
        echo "Both must answer. The receiver being reachable from here is what makes it"
        echo "meaningful when the AGENT cannot reach it: the difference is then the"
        echo "egress policy, not a dead endpoint."

        if [ "$FAILED" -ne 0 ]; then
          echo
          echo "An endpoint did not come up. Do NOT run the demo: a denial you observe"
          echo "now would be unattributable."
          exit 1
        fi
