apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: REPLACE_WITH_CLUSTER_ISSUER
spec:
  acme:
    email: REPLACE_WITH_LETSENCRYPT_EMAIL
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: REPLACE_WITH_CLUSTER_ISSUER-account-key
    solvers:
      - http01:
          ingress:
            class: REPLACE_WITH_INGRESS_CLASS
