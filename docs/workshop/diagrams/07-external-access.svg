<text x="40.0" y="692.0" font-size="14" fill="#343a40" text-anchor="start" font-weight="bold">Operator steps (tasks/Taskfile.harness.yml, run through the chat-agent: namespace)</text>
<text x="50.0" y="720.0" font-size="15" fill="#1e1e1e" text-anchor="start" font-weight="normal">1  task chat-agent:external-prereqs: install ingress-nginx and cert-manager (Helm, idempotent)</text>
<text x="50.0" y="738.8" font-size="15" fill="#1e1e1e" text-anchor="start" font-weight="normal">2  Read the ingress-nginx LoadBalancer public IP</text>
<text x="50.0" y="757.5" font-size="15" fill="#1e1e1e" text-anchor="start" font-weight="normal">3  Create the DNS A record &lt;fqdn&gt; -&gt; that IP at your DNS provider or Azure DNS (operator-managed)</text>
<text x="50.0" y="776.2" font-size="15" fill="#1e1e1e" text-anchor="start" font-weight="normal">4  task chat-agent:external-app HOSTNAME=&lt;fqdn&gt;: Entra app registration + Secret harness-oidc-config</text>
<text x="50.0" y="795.0" font-size="15" fill="#1e1e1e" text-anchor="start" font-weight="normal">5  task chat-agent:external-up HOSTNAME=&lt;fqdn&gt; LETSENCRYPT_EMAIL=...: ingress + ClusterIssuer, harness to ingress_oidc</text>
<text x="50.0" y="813.8" font-size="15" fill="#1e1e1e" text-anchor="start" font-weight="normal">6  Wait until the Certificate is Ready (task chat-agent:external-status)</text>
<text x="50.0" y="832.5" font-size="15" fill="#1e1e1e" text-anchor="start" font-weight="normal">7  Open https://&lt;fqdn&gt; in a browser and sign in with Entra</text>
