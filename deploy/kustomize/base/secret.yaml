# Values that must not appear in `kubectl get deployment -o yaml`.
#
# THE TWO PLACEHOLDERS IN THIS FILE ARE THE ONLY SECRETS IN THE DEPLOY TREE. The file on
# disk carries placeholders and nothing else; the real values are streamed in at apply
# time from `terraform output -raw` and are never written to a file. Do not add a
# committed overlay that patches real values into this Secret, and do not `kubectl apply`
# a locally rendered copy of it from a path that git can see.
#
# `stringData` rather than `data` on purpose: the substituted values are plain strings,
# and base64-encoding them in the task would mean the task had to handle the secret twice.
apiVersion: v1
kind: Secret
metadata:
  name: agent-harness-config
  namespace: REPLACE_WITH_NAMESPACE
  labels:
    app.kubernetes.io/part-of: agent-boundary-lab
type: Opaque
stringData:
  DEMO_DIAGNOSTICS_TOKEN: REPLACE_WITH_DIAGNOSTICS_TOKEN
  APPLICATIONINSIGHTS_CONNECTION_STRING: REPLACE_WITH_APPINSIGHTS_CONNECTION_STRING
