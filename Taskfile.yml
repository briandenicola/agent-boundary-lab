version: '3'

# Task echoes every command by default, so anything that prints its own
# output shows up twice. These tasks are written to be read by a human
# watching a demo, so the command itself is noise.
silent: true

dotenv: ['.env']

env:
  TITLE: Agent Boundary Lab
  SPIKE_TITLE: Agent Boundary Lab Spike
  # Canada Central hosts everything: the containment environment and, from Phase 8, the
  # workflow state store. It is one of the few regions that permits both. East US 2 cannot
  # host PostgreSQL Flexible Server on this subscription, and Flexible Server uses VNet
  # injection, so the database cannot simply live elsewhere. See compatibility.md A2a/A2b.
  DEFAULT_REGION: canadacentral

includes:
  cloud:
    taskfile: ./tasks/Taskfile.cloud.yml
    internal: false

  build:
    taskfile: ./tasks/Taskfile.build.yml
    internal: false

  deploy:
    taskfile: ./tasks/Taskfile.deploy.yml
    internal: false

  test-ui:
    taskfile: ./tasks/Taskfile.ui.yml
    aliases: [ui]
    internal: false

  agent-bridge:
    taskfile: ./tasks/Taskfile.a2a.yml
    aliases: [a2a]
    internal: false

  chat-agent:
    taskfile: ./tasks/Taskfile.harness.yml
    aliases: [harness]
    internal: false

  model-server:
    taskfile: ./tasks/Taskfile.local-model.yml
    aliases: [local-model]
    internal: false

  spike:
    taskfile: ./tasks/Taskfile.spike.yml
    internal: false

  lint:
    taskfile: ./tasks/Taskfile.lint.yml
    internal: false

  verify:
    taskfile: ./tasks/Taskfile.verify.yml
    internal: false

  identity:
    taskfile: ./tasks/Taskfile.identity.yml
    internal: false

tasks:
  foundry-agent:plan:
    desc: Server-side dry run of the Foundry publishing helper
    cmds:
      - task: cloud:harness-plan

  foundry-agent:status:
    desc: Show the Foundry publishing helper and its init-container result
    cmds:
      - task: cloud:harness-status

  foundry-agent:down:
    desc: Remove the publishing helper AND its namespace; published Foundry versions remain
    cmds:
      - task: cloud:harness-down

  tool-apis:check:
    desc: Check that both controlled tool API health endpoints answer
    cmds:
      - task: build:check-endpoints

  default:
    desc: Show available tasks
    cmds:
      - task --list
