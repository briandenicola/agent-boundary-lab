apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-model
  namespace: REPLACE_WITH_NAMESPACE
  labels:
    app.kubernetes.io/part-of: agent-boundary-lab
    app.kubernetes.io/name: local-model
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: local-model
  template:
    metadata:
      labels:
        app.kubernetes.io/name: local-model
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: local-model
          image: REPLACE_WITH_LOCAL_MODEL_IMAGE
          ports:
            - name: http
              containerPort: 8080
          env:
            # Measure before tuning (B12): set to the CPU request, not the node's core count.
            - name: LLAMA_THREADS
              value: "2"
            - name: LLAMA_CTX
              value: "4096"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: "2", memory: 4Gi}
            limits: {memory: 5Gi}
