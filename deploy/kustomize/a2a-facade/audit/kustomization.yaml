apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
nameSuffix: -audit
labels:
  - pairs:
      a2a-facade.agent-boundary-lab/slot: audit
    includeSelectors: true
patches:
  - target:
      kind: Deployment
      name: a2a-facade
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: REPLACE_WITH_AGENT_NAME_AUDIT
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: http://a2a-facade-audit.REPLACE_WITH_NAMESPACE.svc.cluster.local
